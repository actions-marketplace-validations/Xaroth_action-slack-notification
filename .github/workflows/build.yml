name: Rebuild dist

on:
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Send slack notification
        # We add this if to ensure this doesn't run on forks.
        # If you really want to run this on your own fork, configure the required secrets.
        if: env.SLACK_BOT_TOKEN && env.SLACK_CHANNEL_ID
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        uses: ./
        with:
          slack-token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          message-summary: Checking if ${{ github.ref_name }} needs an updated build

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the build
        run: pnpm build

      - name: Check for modified files
        id: is-modified
        run: echo "modified=$(if [ "$(git diff --ignore-space-at-eol dist/ | wc -l)" -gt "0" ]; then echo "true"; else echo "false"; fi)" >> "$GITHUB_OUTPUT"

      - name: Push changes if there are any
        if: steps.is-modified.outputs.modified == 'true'
        env:
          ACTOR: ${{ github.actor }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git commit dist/ -m "build: rebuild dist bundle" --author="${ACTOR} <${ACTOR}@users.noreply.github.com>"
          git push
